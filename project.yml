name: PhotoSorter
options:
  bundleIdPrefix: me.egigoka
  deploymentTarget:
    iOS: "18.0"
targets:
  PhotoSorter:
    type: application
    platform: iOS
    sources:
      - path: PhotoSorter
      - path: Models/siglip2_b16_image.mlmodelc
        type: folder
        buildPhase: resources
    info:
      path: PhotoSorter/Info.plist
      properties:
        # Lets animations run at 120 Hz on iPhone. Without it they stop at 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.egigoka.photosorter
        DEVELOPMENT_TEAM: PTT6GCQ699
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photo Sorter
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Photo Sorter classifies your photos on device to find screenshots, memes and saved images.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # iPad windows resize freely, so iPad takes every orientation.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
